schema: buildrix-study/1
trials: 3
seed: 42
# Time per run is set by the study, per task, the same for every agent.
# (An older `timeout_s: N` still works and means time.default_s: N.)
time:
  default_s: 3600
  # tasks:                      # tasks that legitimately need longer
  #   YOUR_LONG_TASK_CODE: 36000
  # reference:                  # or: factor x a reference run on this machine
  #   results: ./reference-results
  #   model: YOUR_REFERENCE_MODEL_ID
  #   factor: 3
visibility: public

# Use native for a development smoke test with trusted packages.
# Research: backend: docker, image: your-image@sha256:YOUR_DIGEST
# Slurm: backend: apptainer, image: /shared/images/buildrix.sif
execution:
  backend: native

agents:
  - provider: codex
    model: YOUR_OPENAI_MODEL_ID
  - provider: claude
    model: YOUR_ANTHROPIC_MODEL_ID

pairs:
  # Paths are relative to this manifest. Replace with your local skill.
  - skill: ./my-skill
    tasks: [YOUR_TASK_CODE]
  # To freeze strong matches from the existing semantic matcher:
  # - skill: ./another-skill
  #   match: true
  # Task-only study (two conditions):
  # - tasks: [YOUR_TASK_CODE]
